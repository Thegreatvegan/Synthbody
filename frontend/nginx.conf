server {
    listen 5180;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app: unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simulations and the validation pipeline are CPU-bound; a 2000-subject
    # cohort can legitimately take minutes, so the proxy must not time out
    # before the engine finishes.
    location /api/ {
        proxy_pass http://backend:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /health {
        proxy_pass http://backend:8011/health;
        proxy_set_header Host $host;
    }
}
